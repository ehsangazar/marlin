# The thing this repository could not say before: that it builds on a machine
# that is not Gaz's.
#
# GitHub-hosted runners on purpose. There are self-hosted runners on the VPS and
# they are the right answer for the private repositories, but Marlin is public,
# and a self-hosted runner on a public repository executes whatever a fork's
# pull request tells it to on a box that also runs production.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Typecheck and build the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` is tsc --noEmit followed by vite build, so this is the
      # typecheck and the bundle in one step.
      - run: pnpm build

  rust:
    name: Rust ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system webview. macOS and Windows ship one;
      # Linux needs it installed, and this list is the reason "Linux is
      # untested" was true rather than merely unmeasured.
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The frontend has to exist before the Rust build: tauri embeds ../dist,
      # and a missing dist fails the build in a way that reads like a Rust error.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # No `cargo fmt --check` gate. This codebase lays out tables and long
      # chains by hand, on purpose, and rustfmt disagrees with several of them.
      # A check whose fix is "undo the readable version" is a check that trains
      # you to ignore checks.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all

      - name: Build
        working-directory: src-tauri
        run: cargo build --release
