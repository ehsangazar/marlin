# Build the installers on machines that are not Gaz's, and attach them to the tag.
#
# Before this existed a release was one `tauri build` on one Apple Silicon Mac,
# so the only artefact Marlin had ever shipped was `Marlin_x.y.z_aarch64.dmg`.
# That is not "macOS": it excludes every Intel Mac. And there was no Windows
# build at all, in a repository whose README claims the stack is cross-platform.
#
# What this produces, per tag:
#   macOS    one universal disk image, Apple Silicon and Intel in one file
#   Windows  an NSIS installer and an MSI, x64
#   Linux    an AppImage and a .deb, x64
#
# Linux was added last and is the only one of the three that a user can run
# without arguing with their operating system first. There is no Apple
# Developer ID and no Windows signing certificate, and after six refused
# enrolment attempts there is no date by which there will be, so the macOS
# download meets Gatekeeper and the Windows download meets SmartScreen. The
# Linux download meets nothing. That is why this file grew a third leg.
#
# Deliberately NOT here: publishing site/version.json. That file is the update
# feed every installed copy polls, it lives on the Hetzner box, and putting a
# root SSH key for a server that also runs production into the secrets of a
# PUBLIC repository is not a trade worth making for one scp. scripts/publish.sh
# does that step from Gaz's machine, after this workflow has put the installers
# somewhere real. Order matters: a feed pointing at a release that has no
# artefacts tells every running copy to download a 404.
name: Release

on:
  push:
    tags: ["v*"]
  # A rerun path that does not need a new tag: the build can fail on something
  # that has nothing to do with the code, and re-tagging to retry is how tags
  # stop meaning anything.
  workflow_dispatch:
    inputs:
      # Optional, and that is load-bearing for dry runs. Leave it empty and the
      # workflow builds the branch you dispatched from, which is the tree you
      # are about to tag. The first dry run was given v0.1.1 and dutifully
      # tested the previous night's code: it failed on a clippy lint that had
      # already been fixed on main. A rehearsal of the wrong tree is worse than
      # no rehearsal, because it reports a problem you have already solved.
      tag:
        description: "Existing tag to build, e.g. v0.1.2. Leave EMPTY for a dry run of the current branch."
        required: false
      dry_run:
        description: "Build and list the installers, upload nothing"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  # One job creates the release, as a draft, before anything uploads. Three
  # matrix jobs racing to `gh release create` is two failures and a coin toss.
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # One source for what changed. The release body is the changelog section
      # for this version, never a second description that drifts from it.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `tag` is optional so dry runs can build a branch, which means a real
          # dispatch can reach here with TAG set to a branch name. Releasing
          # "main" would create a junk release that the update feed could then
          # be pointed at, so refuse rather than improvise.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::TAG is '$TAG', which is not a version tag. Pass tag=vX.Y.Z, or set dry_run for a branch build."; exit 1 ;;
          esac
          V="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, reusing it"
            exit 0
          fi
          NOTES="$(awk -v v="## \\[$V\\]" 'BEGIN{p=0} $0 ~ v {p=1; next} /^## \[/ && p {exit} p' CHANGELOG.md)"
          [ -n "$NOTES" ] || NOTES="See CHANGELOG.md."
          gh release create "$TAG" --draft --title "Marlin $TAG" --notes "$NOTES"

  bundle:
    name: ${{ matrix.name }}
    needs: draft
    # `always()` so a dry run, which skips the draft job, still builds.
    if: ${{ always() && needs.draft.result != 'failure' }}
    strategy:
      # One platform failing should still leave the others' installers
      # attached, so the release can be salvaged by rerunning a single job.
      fail-fast: false
      matrix:
        include:
          # Universal, not aarch64. An Intel Mac is still a Mac, and a second
          # dmg is a second thing to pick wrong on the download page.
          - name: macOS (universal)
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            # Empty on purpose: tauri.conf.json says `"targets": "all"` and on
            # these two platforms that is already the right answer. Only Linux
            # needs to narrow it, and see the build step for why this is a
            # matrix key rather than an `if:` on a second copy of the step.
            bundle_args: ""
            glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundle_args: ""
            glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/{nsis/*.exe,msi/*.msi}
          # Two bundles, and the third was rejected rather than forgotten.
          #
          #   appimage  one file, `chmod +x`, no root and no package manager,
          #             and it runs on a distro nobody here has heard of. It is
          #             the artefact the download page should point at.
          #   deb       because the AppImage has one real wart and pretending
          #             otherwise gets found out in public: Ubuntu dropped
          #             libfuse2 from the default install at 22.04, and a type-2
          #             AppImage on a stock Ubuntu greets you with a dlopen
          #             error about libfuse.so.2. The .deb sidesteps that on the
          #             most common desktop Linux there is, and puts Marlin in
          #             the application menu instead of in ~/Downloads.
          #   rpm       NOT built. Every rpm distro can run the AppImage, dnf
          #             warns about an unsigned package off a website anyway,
          #             and there is no repository behind it for anything to
          #             update from. It buys a third thing to pick wrong on the
          #             download page and nothing else.
          #
          # ubuntu-22.04, not `ubuntu-latest`, and this is the one thing ci.yml
          # is allowed to be careless about because it never ships what it
          # compiles. An AppImage bundles webkit and its friends; it does NOT
          # bundle glibc, so the build machine's glibc silently becomes the
          # artefact's minimum. Built on 24.04 that floor is 2.39, which locks
          # out Ubuntu 22.04 LTS (2.35), Debian 12 (2.36) and RHEL 9 (2.34):
          # a file whose entire pitch is "runs anywhere" refusing to start on
          # the most widely installed LTS. Built here the floor is 2.35 and all
          # of those work.
          #
          # This has an expiry and it is dated, so nobody has to rediscover it:
          # GitHub begins deprecating the Ubuntu 22 images on 17 Sep 2026 and
          # removes them by 17 Apr 2027, announced in actions/runner-images
          # #14254. The images table in that repository's README still shows no
          # deprecation badge against them, so the announcement is the only
          # place it is written down. When this leg starts failing to find a
          # runner, that is why. The fix is not `ubuntu-latest`, which just
          # moves the floor up again; it is building inside an older container
          # on a newer runner, so the glibc floor stops being a property of
          # whichever image GitHub is retiring this year.
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,appimage
            # Brace expansion, exactly like the Windows entry above, and for the
            # same reason: two bundlers write into two sibling directories. The
            # comments on the upload step explain why this is bare brace
            # expansion and not `shopt -s globstar`; do not "fix" it back.
            # `appimage/` also holds the Marlin.AppDir staging tree that built
            # the thing, which `*.AppImage` correctly does not match.
            glob: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/{deb/*.deb,appimage/*.AppImage}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Tauri links against the system webview. macOS and Windows ship one and
      # Linux does not, so without this the failure arrives as a pkg-config
      # error out of a -sys crate's build script during Clippy, several steps
      # before anything that looks like bundling. This list is character for
      # character the one ci.yml has been proving on a runner since Linux joined
      # that matrix, and it is duplicated rather than shared on purpose: two
      # copies that are identical are easier to reason about than one composite
      # action, but they do have to be kept identical.
      - name: Install the Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils

      - uses: dtolnay/rust-toolchain@stable
      - name: Add the build targets
        run: rustup target add ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same gates ci.yml runs, because a tag is the one build where a
      # warning is expensive. No `cargo fmt --check`: this codebase lays out
      # several tables and chains by hand and rustfmt disagrees, so the gate's
      # only fix would be to undo the readable version.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin' || matrix.target }} -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --all

      # Unsigned on two of the three, and the workflow says so rather than
      # letting it be discovered at the far end. There is no Apple Developer ID
      # and no Windows signing certificate, so macOS shows "Apple could not
      # verify this app" and Windows shows SmartScreen. Both are covered in the
      # README. Linux asks for neither and that is not a gap to be closed later,
      # it is the reason the Linux leg is worth its runner minutes. When the
      # other two certificates exist they plug in here as secrets and nothing
      # else in this file changes.
      #
      # `bundle_args` is a matrix key, empty on macOS and Windows, rather than a
      # second copy of this step behind an `if:`. Two build steps that must stay
      # in step with each other is how one of them quietly stops getting the
      # flag the other gained.
      - name: Build the installers
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      # Did the signature actually take? This exists because for every build
      # this project has ever shipped the answer was no, and nothing said so.
      #
      # With no `signingIdentity` configured and no APPLE_CERTIFICATE in the
      # environment, tauri-bundler's keychain lookup returns nothing, the whole
      # signing branch is skipped and `codesign` is never run. What survives is
      # the linker's automatic ad-hoc signature, which covers the Mach-O and
      # seals no bundle resources. macOS does not read that as "unsigned". It
      # reads it as corrupt, and shows "Marlin is damaged and can't be opened.
      # You should move it to the Trash", which is not a warning a user can
      # consciously accept, it is a dead end. v0.1.1 shipped exactly that:
      # `flags=0x20002(adhoc,linker-signed)`, `Info.plist=not bound`,
      # `Sealed Resources=none`, and spctl answering "code has no resources but
      # signature indicates they must be present".
      #
      # The fix is one config key, `"signingIdentity": "-"` in tauri.conf.json,
      # and no Apple account. It lives in the config rather than as
      # APPLE_SIGNING_IDENTITY in this file so that a person building from
      # source on a Mac gets the same bundle CI does; the README sends people to
      # build from source, and a build that only comes out right inside CI is a
      # trap laid for whoever takes that advice.
      #
      # This step is the guard, because the failure was invisible for four
      # months. `--verify --strict` fails the build if the seal goes missing
      # again. It deliberately does NOT assert the app is trusted: it is not,
      # and cannot be without notarization. It asserts the bundle is well
      # formed, which is a different thing and one we can actually have.
      #
      # If Marlin ever bundles a framework, note tauri-apps/tauri#8763: an
      # ad-hoc signature on the app that disagrees with the one on the framework
      # crashes it at launch. There is no framework today.
      - name: Check the macOS signature is a real one
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Marlin.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee sig.txt
          codesign --verify --strict --verbose=2 "$APP"
          if grep -q "Sealed Resources=none" sig.txt; then
            echo "::error::linker-signed only, so macOS will call this damaged rather than unsigned"
            exit 1
          fi
          # Reported, never gated. spctl rejects anything unnotarized and always
          # will; what matters is WHICH rejection, so keep the sentence in the
          # log rather than reducing it to a pass or a fail.
          spctl -a -vvv -t exec "$APP" 2>&1 || true
          echo "- macOS bundle is ad-hoc signed with its resources sealed, and is not notarized" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `nullglob` only, and the two that are not here were each a bug.
          # `braceexpand` is a `set -o` option, not a shopt, so it is rejected on
          # every platform; `globstar` does not exist in bash 3.2, which is what
          # /bin/bash still is on the macOS runner. Under `set -e` a rejected
          # shopt kills the step on line 2, so the glob below never ran and the
          # error claimed the bundler had produced nothing while the build log
          # showed it producing all three installers. Neither option was needed:
          # there is no `**` in the patterns, and brace expansion is on by
          # default in every bash that matters.
          shopt -s nullglob
          files=(${{ matrix.glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers matched ${{ matrix.glob }}: the bundler produced nothing"
            find src-tauri/target -name 'bundle' -type d -print 2>/dev/null || true
            exit 1
          fi
          # The names matter as much as the files: scripts/version-json.mjs
          # writes these into the update feed, and publish.sh refuses to ship a
          # feed naming an artefact the release does not have. A dry run exists
          # to compare the two lists before a tag depends on them.
          for f in "${files[@]}"; do
            echo "  $(basename "$f")  $(du -h "$f" | cut -f1)"
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: built ${#files[@]} installer(s), uploading none"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Does the Windows build actually install and start?
  #
  # This job exists because of a real deadlock: the honest line in the README is
  # "Windows is built, not exercised", nobody has a Windows machine to exercise
  # it on, and "somebody ran it once" was the gate on announcing the project
  # anywhere that Windows users read. Compiling is not the same as running:
  # WebView2 could be missing, ConPTY could fail, the installer could put the
  # exe somewhere else. So the runner does it.
  #
  # What this can and cannot prove, stated plainly so nobody quotes it as more
  # than it is. It CAN prove: the NSIS installer completes unattended, the
  # executable lands where the installer says, the process starts and does not
  # exit on its own. It CANNOT prove anything a person would notice: whether the
  # window renders, whether a prompt appears, whether typing works.
  smoke:
    name: Windows smoke test
    needs: bundle
    # `needs.bundle.result` is the whole matrix and there is no way to depend on
    # one leg of one, so when Linux was added this job's gate quietly became
    # "and Linux was fine too". A missing apt package on a machine with no
    # relationship to Windows would then delete the only Windows evidence this
    # project has, which is the exact opposite of why the job exists.
    #
    # It rebuilds Windows from source below and reads nothing the bundle job
    # produced, so it never needed that job to succeed at all: `needs` is here
    # for ordering, and to not burn a Windows runner on a workflow whose draft
    # step already failed. `!cancelled()` keeps that and gives up the coupling.
    if: ${{ !cancelled() && needs.bundle.result != 'skipped' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Rebuilt rather than downloaded from the release, so a dry run can smoke
      # test too, and so this never depends on an upload having happened.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target x86_64-pc-windows-msvc

      # The deterministic half. This gates: if the installer does not produce a
      # runnable exe, the Windows download on the site is a lie.
      - name: Install it, silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Recurse -Filter "*-setup.exe" `
            -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer was produced" }
          Write-Host "installer: $($setup.Name)"
          # /S is NSIS silent. installMode is currentUser, so no elevation.
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait

          # Found, not assumed, and the first run of this proved why: it looked
          # only under $LOCALAPPDATA\Programs, which does not exist on a fresh
          # runner at all, so it reported "the installer produced no marlin.exe"
          # about an installer that had worked. Ask NSIS where it put things
          # instead of guessing: it always writes an uninstall entry, and
          # InstallLocation is the answer regardless of which default Tauri's
          # template picked this month.
          $roots = @()
          foreach ($hive in "HKCU:", "HKLM:") {
            Get-ItemProperty -ErrorAction SilentlyContinue `
              -Path "$hive\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
              Where-Object { $_.DisplayName -like "Marlin*" -and $_.InstallLocation } |
              ForEach-Object {
                Write-Host "uninstall entry: $($_.DisplayName) -> $($_.InstallLocation)"
                $roots += $_.InstallLocation
              }
          }
          # Filesystem fallback, widened to every root the two install modes can
          # land in. Only reached if the registry lookup found nothing.
          $roots += "$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}"

          $exe = $null
          foreach ($root in $roots) {
            if (-not $root -or -not (Test-Path $root)) { continue }
            $exe = Get-ChildItem -Recurse -Filter "marlin.exe" -Path $root `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) {
            Write-Host "no marlin.exe under any of:"
            $roots | ForEach-Object { Write-Host "  $_" }
            Write-Host "uninstall entries mentioning Marlin:"
            foreach ($hive in "HKCU:", "HKLM:") {
              Get-ItemProperty -ErrorAction SilentlyContinue `
                -Path "$hive\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
                Where-Object { $_.DisplayName -like "*arlin*" } |
                ForEach-Object { Write-Host "  $($_.DisplayName) @ $($_.InstallLocation)" }
            }
            throw "the installer ran but produced no marlin.exe"
          }
          Write-Host "installed: $($exe.FullName)"
          "MARLIN_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "- Windows installer completed and produced ``$($exe.Name)``" >> $env:GITHUB_STEP_SUMMARY

      # The reporting half. Deliberately does NOT gate the release: a GUI
      # process on a runner with no interactive desktop is exactly the kind of
      # thing that fails for reasons that have nothing to do with the app, and a
      # release blocked by a flaky window is worse than a release that says it
      # is unverified. Read the result, do not automate on it.
      - name: Start it, and see whether it stays up
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:MARLIN_EXE" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            "- Marlin.exe started then exited with $($p.ExitCode) within 20s" >> $env:GITHUB_STEP_SUMMARY
            throw "it did not stay running"
          }
          Stop-Process -Id $p.Id -Force
          "- Marlin.exe started and was still running after 20s" >> $env:GITHUB_STEP_SUMMARY

  # Undraft only once every platform has attached something. A half-populated
  # release that is already public is the one state the update feed must never
  # be pointed at. No `always()` here, so this inherits "every leg of `bundle`
  # succeeded", and adding Linux to that matrix deliberately added Linux to this
  # gate: a release that says it ships Linux and does not is worse than a
  # release that waits.
  publish:
    name: Publish the release
    needs: bundle
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "### $TAG is live" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json assets --jq '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Now run \`scripts/publish.sh\` locally to point the update feed at it." >> "$GITHUB_STEP_SUMMARY"
