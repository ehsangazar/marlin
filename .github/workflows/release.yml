# Build the installers on machines that are not Gaz's, and attach them to the tag.
#
# Before this existed a release was one `tauri build` on one Apple Silicon Mac,
# so the only artefact Marlin had ever shipped was `Marlin_x.y.z_aarch64.dmg`.
# That is not "macOS": it excludes every Intel Mac. And there was no Windows
# build at all, in a repository whose README claims the stack is cross-platform.
#
# What this produces, per tag:
#   macOS    one universal disk image, Apple Silicon and Intel in one file
#   Windows  an NSIS installer and an MSI, x64
#   Linux    an AppImage and a .deb, x64
#
# Linux was added last and is the only one of the three that a user can run
# without arguing with their operating system first. There is no Apple
# Developer ID and no Windows signing certificate, and after six refused
# enrolment attempts there is no date by which there will be, so the macOS
# download meets Gatekeeper and the Windows download meets SmartScreen. The
# Linux download meets nothing. That is why this file grew a third leg.
#
# Deliberately NOT here: publishing site/version.json. That file is the update
# feed every installed copy polls, it lives on the Hetzner box, and putting a
# root SSH key for a server that also runs production into the secrets of a
# PUBLIC repository is not a trade worth making for one scp. scripts/publish.sh
# does that step from Gaz's machine, after this workflow has put the installers
# somewhere real. Order matters: a feed pointing at a release that has no
# artefacts tells every running copy to download a 404.
name: Release

on:
  push:
    tags: ["v*"]
  # A rerun path that does not need a new tag: the build can fail on something
  # that has nothing to do with the code, and re-tagging to retry is how tags
  # stop meaning anything.
  workflow_dispatch:
    inputs:
      # Optional, and that is load-bearing for dry runs. Leave it empty and the
      # workflow builds the branch you dispatched from, which is the tree you
      # are about to tag. The first dry run was given v0.1.1 and dutifully
      # tested the previous night's code: it failed on a clippy lint that had
      # already been fixed on main. A rehearsal of the wrong tree is worse than
      # no rehearsal, because it reports a problem you have already solved.
      tag:
        description: "Existing tag to build, e.g. v0.1.2. Leave EMPTY for a dry run of the current branch."
        required: false
      dry_run:
        description: "Build and list the installers, upload nothing"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  # One job creates the release, as a draft, before anything uploads. Three
  # matrix jobs racing to `gh release create` is two failures and a coin toss.
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # One source for what changed. The release body is the changelog section
      # for this version, never a second description that drifts from it.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `tag` is optional so dry runs can build a branch, which means a real
          # dispatch can reach here with TAG set to a branch name. Releasing
          # "main" would create a junk release that the update feed could then
          # be pointed at, so refuse rather than improvise.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::TAG is '$TAG', which is not a version tag. Pass tag=vX.Y.Z, or set dry_run for a branch build."; exit 1 ;;
          esac
          V="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, reusing it"
            exit 0
          fi
          NOTES="$(awk -v v="## \\[$V\\]" 'BEGIN{p=0} $0 ~ v {p=1; next} /^## \[/ && p {exit} p' CHANGELOG.md)"
          [ -n "$NOTES" ] || NOTES="See CHANGELOG.md."
          gh release create "$TAG" --draft --title "Marlin $TAG" --notes "$NOTES"

  bundle:
    name: ${{ matrix.name }}
    needs: draft
    # `always()` so a dry run, which skips the draft job, still builds.
    if: ${{ always() && needs.draft.result != 'failure' }}
    strategy:
      # One platform failing should still leave the others' installers
      # attached, so the release can be salvaged by rerunning a single job.
      fail-fast: false
      matrix:
        include:
          # Universal, not aarch64. An Intel Mac is still a Mac, and a second
          # dmg is a second thing to pick wrong on the download page.
          - name: macOS (universal)
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            # Empty on purpose: tauri.conf.json says `"targets": "all"` and on
            # these two platforms that is already the right answer. Only Linux
            # needs to narrow it, and see the build step for why this is a
            # matrix key rather than an `if:` on a second copy of the step.
            bundle_args: ""
            glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundle_args: ""
            glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/{nsis/*.exe,msi/*.msi}
          # Two bundles, and the third was rejected rather than forgotten.
          #
          #   appimage  one file, `chmod +x`, no root and no package manager,
          #             and it runs on a distro nobody here has heard of. It is
          #             the artefact the download page should point at.
          #   deb       because the AppImage has one real wart and pretending
          #             otherwise gets found out in public: Ubuntu dropped
          #             libfuse2 from the default install at 22.04, and a type-2
          #             AppImage on a stock Ubuntu greets you with a dlopen
          #             error about libfuse.so.2. The .deb sidesteps that on the
          #             most common desktop Linux there is, and puts Marlin in
          #             the application menu instead of in ~/Downloads.
          #   rpm       NOT built. Every rpm distro can run the AppImage, dnf
          #             warns about an unsigned package off a website anyway,
          #             and there is no repository behind it for anything to
          #             update from. It buys a third thing to pick wrong on the
          #             download page and nothing else.
          #
          # ubuntu-22.04, not `ubuntu-latest`, and this is the one thing ci.yml
          # is allowed to be careless about because it never ships what it
          # compiles. An AppImage bundles webkit and its friends; it does NOT
          # bundle glibc, so the build machine's glibc silently becomes the
          # artefact's minimum. Built on 24.04 that floor is 2.39, which locks
          # out Ubuntu 22.04 LTS (2.35), Debian 12 (2.36) and RHEL 9 (2.34):
          # a file whose entire pitch is "runs anywhere" refusing to start on
          # the most widely installed LTS. Built here the floor is 2.35 and all
          # of those work.
          #
          # This has an expiry and it is dated, so nobody has to rediscover it:
          # GitHub begins deprecating the Ubuntu 22 images on 17 Sep 2026 and
          # removes them by 17 Apr 2027, announced in actions/runner-images
          # #14254. The images table in that repository's README still shows no
          # deprecation badge against them, so the announcement is the only
          # place it is written down. When this leg starts failing to find a
          # runner, that is why. The fix is not `ubuntu-latest`, which just
          # moves the floor up again; it is building inside an older container
          # on a newer runner, so the glibc floor stops being a property of
          # whichever image GitHub is retiring this year.
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,appimage
            # Brace expansion, exactly like the Windows entry above, and for the
            # same reason: two bundlers write into two sibling directories. The
            # comments on the upload step explain why this is bare brace
            # expansion and not `shopt -s globstar`; do not "fix" it back.
            # `appimage/` also holds the Marlin.AppDir staging tree that built
            # the thing, which `*.AppImage` correctly does not match.
            glob: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/{deb/*.deb,appimage/*.AppImage}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Tauri links against the system webview. macOS and Windows ship one and
      # Linux does not, so without this the failure arrives as a pkg-config
      # error out of a -sys crate's build script during Clippy, several steps
      # before anything that looks like bundling. This list is character for
      # character the one ci.yml has been proving on a runner since Linux joined
      # that matrix, and it is duplicated rather than shared on purpose: two
      # copies that are identical are easier to reason about than one composite
      # action, but they do have to be kept identical.
      - name: Install the Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils

      - uses: dtolnay/rust-toolchain@stable
      - name: Add the build targets
        run: rustup target add ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same gates ci.yml runs, because a tag is the one build where a
      # warning is expensive. No `cargo fmt --check`: this codebase lays out
      # several tables and chains by hand and rustfmt disagrees, so the gate's
      # only fix would be to undo the readable version.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin' || matrix.target }} -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --all

      # Unsigned on two of the three, and the workflow says so rather than
      # letting it be discovered at the far end. There is no Apple Developer ID
      # and no Windows signing certificate, so macOS shows "Apple could not
      # verify this app" and Windows shows SmartScreen. Both are covered in the
      # README. Linux asks for neither and that is not a gap to be closed later,
      # it is the reason the Linux leg is worth its runner minutes. When the
      # other two certificates exist they plug in here as secrets and nothing
      # else in this file changes.
      #
      # `bundle_args` is a matrix key, empty on macOS and Windows, rather than a
      # second copy of this step behind an `if:`. Two build steps that must stay
      # in step with each other is how one of them quietly stops getting the
      # flag the other gained.
      - name: Build the installers
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      # Did the signature actually take? This exists because for every build
      # this project has ever shipped the answer was no, and nothing said so.
      #
      # With no `signingIdentity` configured and no APPLE_CERTIFICATE in the
      # environment, tauri-bundler's keychain lookup returns nothing, the whole
      # signing branch is skipped and `codesign` is never run. What survives is
      # the linker's automatic ad-hoc signature, which covers the Mach-O and
      # seals no bundle resources. macOS does not read that as "unsigned". It
      # reads it as corrupt, and shows "Marlin is damaged and can't be opened.
      # You should move it to the Trash", which is not a warning a user can
      # consciously accept, it is a dead end. v0.1.1 shipped exactly that:
      # `flags=0x20002(adhoc,linker-signed)`, `Info.plist=not bound`,
      # `Sealed Resources=none`, and spctl answering "code has no resources but
      # signature indicates they must be present".
      #
      # The fix is one config key, `"signingIdentity": "-"` in tauri.conf.json,
      # and no Apple account. It lives in the config rather than as
      # APPLE_SIGNING_IDENTITY in this file so that a person building from
      # source on a Mac gets the same bundle CI does; the README sends people to
      # build from source, and a build that only comes out right inside CI is a
      # trap laid for whoever takes that advice.
      #
      # This step is the guard, because the failure was invisible for four
      # months. `--verify --strict` fails the build if the seal goes missing
      # again. It deliberately does NOT assert the app is trusted: it is not,
      # and cannot be without notarization. It asserts the bundle is well
      # formed, which is a different thing and one we can actually have.
      #
      # If Marlin ever bundles a framework, note tauri-apps/tauri#8763: an
      # ad-hoc signature on the app that disagrees with the one on the framework
      # crashes it at launch. There is no framework today.
      - name: Check the macOS signature is a real one
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Marlin.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee sig.txt
          codesign --verify --strict --verbose=2 "$APP"
          if grep -q "Sealed Resources=none" sig.txt; then
            echo "::error::linker-signed only, so macOS will call this damaged rather than unsigned"
            exit 1
          fi
          # Reported, never gated. spctl rejects anything unnotarized and always
          # will; what matters is WHICH rejection, so keep the sentence in the
          # log rather than reducing it to a pass or a fail.
          spctl -a -vvv -t exec "$APP" 2>&1 || true
          echo "- macOS bundle is ad-hoc signed with its resources sealed, and is not notarized" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `nullglob` only, and the two that are not here were each a bug.
          # `braceexpand` is a `set -o` option, not a shopt, so it is rejected on
          # every platform; `globstar` does not exist in bash 3.2, which is what
          # /bin/bash still is on the macOS runner. Under `set -e` a rejected
          # shopt kills the step on line 2, so the glob below never ran and the
          # error claimed the bundler had produced nothing while the build log
          # showed it producing all three installers. Neither option was needed:
          # there is no `**` in the patterns, and brace expansion is on by
          # default in every bash that matters.
          shopt -s nullglob
          files=(${{ matrix.glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers matched ${{ matrix.glob }}: the bundler produced nothing"
            find src-tauri/target -name 'bundle' -type d -print 2>/dev/null || true
            exit 1
          fi
          # The names matter as much as the files: scripts/version-json.mjs
          # writes these into the update feed, and publish.sh refuses to ship a
          # feed naming an artefact the release does not have. A dry run exists
          # to compare the two lists before a tag depends on them.
          for f in "${files[@]}"; do
            echo "  $(basename "$f")  $(du -h "$f" | cut -f1)"
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: built ${#files[@]} installer(s), uploading none"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Does the Windows build actually install and start?
  #
  # This job exists because of a real deadlock: the honest line in the README is
  # "Windows is built, not exercised", nobody has a Windows machine to exercise
  # it on, and "somebody ran it once" was the gate on announcing the project
  # anywhere that Windows users read. Compiling is not the same as running:
  # WebView2 could be missing, ConPTY could fail, the installer could put the
  # exe somewhere else. So the runner does it.
  #
  # What this can and cannot prove, stated plainly so nobody quotes it as more
  # than it is. It CAN prove: the NSIS installer completes unattended, the
  # executable lands where the installer says, the process starts and does not
  # exit on its own. It CANNOT prove anything a person would notice: whether the
  # window renders, whether a prompt appears, whether typing works.
  smoke-windows:
    name: Windows smoke test
    needs: bundle
    # `needs.bundle.result` is the whole matrix and there is no way to depend on
    # one leg of one, so when Linux was added this job's gate quietly became
    # "and Linux was fine too". A missing apt package on a machine with no
    # relationship to Windows would then delete the only Windows evidence this
    # project has, which is the exact opposite of why the job exists.
    #
    # It rebuilds Windows from source below and reads nothing the bundle job
    # produced, so it never needed that job to succeed at all: `needs` is here
    # for ordering, and to not burn a Windows runner on a workflow whose draft
    # step already failed. `!cancelled()` keeps that and gives up the coupling.
    if: ${{ !cancelled() && needs.bundle.result != 'skipped' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Rebuilt rather than downloaded from the release, so a dry run can smoke
      # test too, and so this never depends on an upload having happened.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target x86_64-pc-windows-msvc

      # The deterministic half. This gates: if the installer does not produce a
      # runnable exe, the Windows download on the site is a lie.
      - name: Install it, silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Recurse -Filter "*-setup.exe" `
            -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer was produced" }
          Write-Host "installer: $($setup.Name)"
          # /S is NSIS silent. installMode is currentUser, so no elevation.
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait

          # Found, not assumed, and the first run of this proved why: it looked
          # only under $LOCALAPPDATA\Programs, which does not exist on a fresh
          # runner at all, so it reported "the installer produced no marlin.exe"
          # about an installer that had worked. Ask NSIS where it put things
          # instead of guessing: it always writes an uninstall entry, and
          # InstallLocation is the answer regardless of which default Tauri's
          # template picked this month.
          $roots = @()
          foreach ($hive in "HKCU:", "HKLM:") {
            Get-ItemProperty -ErrorAction SilentlyContinue `
              -Path "$hive\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
              Where-Object { $_.DisplayName -like "Marlin*" -and $_.InstallLocation } |
              ForEach-Object {
                Write-Host "uninstall entry: $($_.DisplayName) -> $($_.InstallLocation)"
                $roots += $_.InstallLocation
              }
          }
          # Filesystem fallback, widened to every root the two install modes can
          # land in. Only reached if the registry lookup found nothing.
          $roots += "$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}"

          $exe = $null
          foreach ($root in $roots) {
            if (-not $root -or -not (Test-Path $root)) { continue }
            $exe = Get-ChildItem -Recurse -Filter "marlin.exe" -Path $root `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) {
            Write-Host "no marlin.exe under any of:"
            $roots | ForEach-Object { Write-Host "  $_" }
            Write-Host "uninstall entries mentioning Marlin:"
            foreach ($hive in "HKCU:", "HKLM:") {
              Get-ItemProperty -ErrorAction SilentlyContinue `
                -Path "$hive\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
                Where-Object { $_.DisplayName -like "*arlin*" } |
                ForEach-Object { Write-Host "  $($_.DisplayName) @ $($_.InstallLocation)" }
            }
            throw "the installer ran but produced no marlin.exe"
          }
          Write-Host "installed: $($exe.FullName)"
          "MARLIN_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "- Windows installer completed and produced ``$($exe.Name)``" >> $env:GITHUB_STEP_SUMMARY

      # The reporting half. Deliberately does NOT gate the release: a GUI
      # process on a runner with no interactive desktop is exactly the kind of
      # thing that fails for reasons that have nothing to do with the app, and a
      # release blocked by a flaky window is worse than a release that says it
      # is unverified. Read the result, do not automate on it.
      - name: Start it, and see whether it stays up
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:MARLIN_EXE" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            "- Marlin.exe started then exited with $($p.ExitCode) within 20s" >> $env:GITHUB_STEP_SUMMARY
            throw "it did not stay running"
          }
          Stop-Process -Id $p.Id -Force
          "- Marlin.exe started and was still running after 20s" >> $env:GITHUB_STEP_SUMMARY

  # Does the Linux build actually install and start?
  #
  # The Windows job above exists because "the Windows package is built and
  # nobody has ever run it" was true. On 22 Aug 2026 that sentence was word for
  # word true of Linux as well, and Linux is the platform the r/rust post is
  # aimed at, so the audience most likely to run the package was the one whose
  # package had least evidence behind it. This job is that sentence's answer.
  #
  # What this can and cannot prove, stated as plainly as the Windows one is.
  # It CAN prove: the .deb resolves its own dependencies and installs on an
  # Ubuntu that has never seen a compiler, the AppImage's payload is intact and
  # extractable, and each of them produces a process that starts and does not
  # exit on its own. It CANNOT prove anything a person would notice: whether the
  # window renders, whether a prompt appears, whether typing works. A virtual
  # framebuffer answers "did the process survive", not "was there anything on
  # the screen".
  #
  # Two artefacts, two steps each, because they fail differently and a single
  # verdict covering both would hide whichever one broke:
  #
  #   .deb       the apt path, and the one the download page lists first. Its
  #              failure mode is dependency metadata: tauri-bundler derives
  #              Depends from what the binary linked against on the build
  #              machine, and the build machine has every -dev package there is.
  #              So the interesting test is not on this runner, it is inside a
  #              bare ubuntu:22.04 container that has none of them.
  #   AppImage   its failure mode is FUSE, and how badly is the open question
  #              this job was built to settle. Ubuntu stopped installing
  #              libfuse2 by default at 22.04, a classic type-2 AppImage needs
  #              it, and the README and the landing page both tell users so and
  #              hand them `--appimage-extract-and-run`. Run 32601226543 then
  #              watched the AppImage mount and run on a machine with no
  #              libfuse2 at all, which means one of those pages is wrong. So
  #              the AppImage is run three ways here: plainly on the runner,
  #              plainly on a container built to look like stock Ubuntu, and
  #              with the documented fallback. A documented workaround nobody
  #              has run is just another claim, and so is a documented problem.
  #
  # The reporting/gating split is the Windows job's and is deliberate: a GUI
  # process on a runner with no interactive desktop fails for reasons that have
  # nothing to do with the app, and a release blocked by a flaky window is worse
  # than a release that says it is unverified.
  smoke-linux:
    name: Linux smoke test
    needs: bundle
    # Identical to the Windows gate above and for the identical reason:
    # `needs.bundle.result` is the whole matrix, so `success()` here would mean
    # "and macOS and Windows were fine too", and a Windows-only failure would
    # then delete the only Linux evidence this project has. This job rebuilds
    # from source and reads nothing `bundle` produced, so `needs` is ordering
    # and nothing more.
    #
    # Neither smoke job is in `publish`'s `needs`, and that stays true: `publish`
    # depends on `bundle` alone. A smoke test is evidence about a package, not a
    # veto over shipping it, and half of each of these jobs is explicitly
    # allowed to fail. If a smoke job should ever gate a release, it has to be
    # the deterministic half that does it, which means splitting it into its own
    # job first.
    if: ${{ !cancelled() && needs.bundle.result != 'skipped' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Third identical copy of the webview list, and see the bundle job's note
      # on why these are duplicated rather than shared: they are easier to
      # reason about that way, but they do have to be kept identical.
      #
      # xvfb and dbus are this job's own, and they are about the runner rather
      # than about Marlin. A GTK application needs an X server to connect to and
      # WebKitGTK talks to a session bus; a GitHub runner has neither. Note what
      # is deliberately NOT installed here: libfuse2. Leaving it off is what
      # makes the AppImage steps below a test of the stock-Ubuntu case rather
      # than a test of a machine that has already been fixed.
      - name: Install the Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils
          sudo apt-get install -y xvfb dbus-x11

      # Rebuilt rather than downloaded from the release, exactly as the Windows
      # job does, so a dry run can smoke test too and so this never depends on
      # an upload having happened. ubuntu-22.04 for the glibc reason spelled out
      # in the bundle matrix; a smoke test on a different floor to the shipped
      # artefact is a smoke test of something else.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-unknown-linux-gnu
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb,appimage

      # One launcher, written once and used three times below, because "did it
      # stay up" is the same question for the .deb, for the AppImage and for the
      # AppImage's fallback, and three copies of it would drift.
      #
      # `timeout` rather than a background process and `kill -0`, and this is
      # not a style preference. A background child that has exited stays a
      # zombie until the shell waits on it, and `kill -0` on a zombie succeeds,
      # so the obvious version of this reports a crashed application as healthy.
      # Here the arithmetic is unambiguous: exit 124 means the timer had to kill
      # it, which is the only outcome that means it was still alive. Every other
      # code, including 0, means it exited on its own inside the window.
      - name: Write the launch probe
        run: |
          cat > "$RUNNER_TEMP/stays-up.sh" <<'PROBE'
          #!/usr/bin/env bash
          # stays-up.sh <label> <command> [args...]
          set -uo pipefail
          label="$1"; shift
          log="$(mktemp)"
          timeout --kill-after=5 20 \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            dbus-run-session -- "$@" >"$log" 2>&1
          rc=$?
          # xvfb-run's child is a grandchild of timeout, so it can outlive the
          # signal that killed its parent. Named exactly, not `pkill -f`, which
          # would also match the wrapper and anything else with the word in it.
          pkill -x marlin 2>/dev/null || true
          if [ "$rc" -eq 124 ]; then
            echo "PASS  $label: still running when the 20s timer killed it. What it said:"
            # Printed on the way past too, not only on failure. A pass here is
            # "something was alive at 20 seconds", and the only way to tell that
            # apart from a wrapper hanging is to see the application's own
            # output, so it goes in the log whichever way the verdict went.
            sed -n '1,25p' "$log" | sed 's/^/      /'
            echo "- Linux: $label started and was still running after 20s" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "FAIL  $label: exited on its own with $rc inside 20s. Its output:"
          sed -n '1,60p' "$log" | sed 's/^/      /'
          echo "- Linux: $label exited on its own with $rc inside 20s" >> "$GITHUB_STEP_SUMMARY"
          exit 1
          PROBE
          chmod +x "$RUNNER_TEMP/stays-up.sh"

      # The deterministic half, part one. This gates: if apt cannot install the
      # .deb, or the AppImage's payload will not come out of it, the Linux
      # downloads on the site are a lie and the job should be red.
      #
      # `apt-get install ./file.deb` rather than `dpkg -i`, because that is what
      # a person does and because dpkg installs the file, leaves the
      # dependencies unmet and exits telling you it worked.
      - name: Install both packages the way a user would
        run: |
          set -euo pipefail
          B=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          shopt -s nullglob
          debs=("$B"/deb/*.deb)
          apps=("$B"/appimage/*.AppImage)
          if [ ${#debs[@]} -ne 1 ]; then echo "::error::expected exactly one .deb, found ${#debs[@]}"; exit 1; fi
          if [ ${#apps[@]} -ne 1 ]; then echo "::error::expected exactly one .AppImage, found ${#apps[@]}"; exit 1; fi
          DEB="$(realpath "${debs[0]}")"
          APPIMG="$(realpath "${apps[0]}")"
          echo "deb:      $DEB  ($(du -h "$DEB" | cut -f1))"
          echo "appimage: $APPIMG  ($(du -h "$APPIMG" | cut -f1))"

          echo "::group::what the .deb says it needs"
          dpkg-deb -f "$DEB" Package Version Depends
          echo "::endgroup::"

          sudo apt-get install -y "$DEB"

          if [ ! -x /usr/bin/marlin ]; then
            echo "::error::the .deb installed but there is no executable /usr/bin/marlin"
            dpkg -L marlin || true
            exit 1
          fi
          echo "::group::what the .deb put on disk"
          dpkg -L marlin
          echo "::endgroup::"

          # Found rather than assumed. The desktop entry is what puts Marlin in
          # the application menu instead of in ~/Downloads, which is the whole
          # reason the .deb is listed first, and its filename is the bundler's
          # choice rather than ours.
          desktop="$(ls /usr/share/applications/ | grep -i marlin || true)"
          if [ -z "$desktop" ]; then
            echo "::error::no .desktop entry, so an apt install leaves nothing in the application menu"
            ls /usr/share/applications/
            exit 1
          fi
          echo "desktop entry: $desktop"

          if ldd /usr/bin/marlin | grep -q "not found"; then
            echo "::error::/usr/bin/marlin has unresolved shared libraries after a clean apt install"
            ldd /usr/bin/marlin | grep "not found"
            exit 1
          fi

          # `--appimage-extract` is the AppImage runtime unpacking itself, and
          # it needs no FUSE at all, which is precisely why it can be gated when
          # the run below cannot. It proves the squashfs payload is intact and
          # contains the binary we think it does.
          chmod +x "$APPIMG"
          work="$(mktemp -d)"
          ( cd "$work" && "$APPIMG" --appimage-extract >/dev/null )
          if [ ! -x "$work/squashfs-root/usr/bin/marlin" ]; then
            echo "::error::the AppImage extracted but carries no usr/bin/marlin"
            find "$work/squashfs-root" -maxdepth 3 | head -40
            exit 1
          fi
          echo "appimage payload: $(du -sh "$work/squashfs-root" | cut -f1), binary present"

          # Reported, never gated, and it decides how to read the two AppImage
          # steps further down. If a future runner image starts shipping
          # libfuse2, the plain run stops being the stock-Ubuntu case and starts
          # being a test of a machine that has already been fixed.
          if ldconfig -p | grep -q 'libfuse\.so\.2'; then
            echo "NOTE: this runner HAS libfuse2, so the plain AppImage run below is not the stock-Ubuntu case"
          else
            echo "this runner has no libfuse2, which is the stock Ubuntu >=22.04 case"
          fi
          # The whole inventory, not just the one library, because the first run
          # of this job (32601226543) reported no libfuse2 and then watched the
          # AppImage mount and run anyway. Something in the sentence on the
          # README and the landing page is wrong, and guessing which part is how
          # a second wrong sentence gets written. So: print what is here.
          #
          # In a subshell with `set +e +o pipefail`, and that is not tidiness.
          # Run 32602196863 put this block straight into the gating step's error
          # handling, `ldd` answered "not a dynamic executable" and exited 1
          # because the AppImage runtime is static, and a DIAGNOSTIC took down
          # the gate it was printing next to. Every command in here is allowed
          # to fail; that is what makes them diagnostics. The `|| true` on the
          # subshell is the second belt.
          echo "::group::what this machine has for FUSE"
          (
            set +e +o pipefail
            ldconfig -p | grep -i fuse || echo "  no libfuse of any version in the linker cache"
            command -v fusermount  || echo "  no fusermount (that is the FUSE 2 helper)"
            command -v fusermount3 || echo "  no fusermount3 (that is the FUSE 3 helper)"
            # Which package puts fusermount there matters more than whether it
            # is there: if stock `fuse3` provides it, the static runtime finds a
            # helper on any modern Ubuntu and the caveat has no subject.
            dpkg -S /usr/bin/fusermount /usr/bin/fusermount3 2>&1 | sed 's/^/  /'
            ls -l /dev/fuse || echo "  no /dev/fuse"
            dpkg -l | grep -iE '\bfuse' || echo "  no fuse package installed"

            # And what the AppImage's own runtime demands, which is the decisive
            # measurement and the one the first run was missing. An AppImage is
            # an ELF with a squashfs stapled to the end of it, so the loader
            # says plainly whether libfuse.so.2 is a hard requirement of the
            # runtime or whether the runtime carries its own. "not a dynamic
            # executable" is the answer that retires the caveat: a static
            # runtime cannot be missing a shared library.
            echo "  what the AppImage runtime links against:"
            file "$APPIMG" | sed 's/^/    /'
            ldd  "$APPIMG" 2>&1 | sed 's/^/    /'
            echo "  strings in the AppImage runtime that mention fuse:"
            head -c 200000 "$APPIMG" > /tmp/appimage-runtime.bin
            strings -n 6 /tmp/appimage-runtime.bin | grep -iE 'fuse' | sort -u | head -20 | sed 's/^/    /'
          ) || true
          echo "::endgroup::"

          {
            echo "- Linux: \`$(basename "$DEB")\` installed via apt, \`/usr/bin/marlin\` present with no missing libraries"
            echo "- Linux: \`$(basename "$APPIMG")\` extracted and carries \`usr/bin/marlin\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "MARLIN_DEB=$DEB" >> "$GITHUB_ENV"
          echo "MARLIN_APPIMAGE=$APPIMG" >> "$GITHUB_ENV"

      # The deterministic half, part two, and the only step here that tests
      # something this runner cannot. Every -dev package the build needed is
      # installed on this machine, so "the .deb installed here" says nothing
      # about whether its Depends line is complete. A bare ubuntu:22.04 has none
      # of them, which is what a person's laptop looks like, so if apt can
      # resolve and install it in there then the dependency metadata is real.
      #
      # No `--no-install-recommends`: a person typing `apt install ./marlin.deb`
      # gets recommends, and a test stricter than the user is a test of
      # something nobody does.
      - name: Check the .deb installs on a machine that has never seen a build
        run: |
          set -euo pipefail
          mkdir -p /tmp/marlin-pkg
          cp "$MARLIN_DEB" /tmp/marlin-pkg/
          docker run --rm -v /tmp/marlin-pkg:/pkg:ro ubuntu:22.04 bash -c '
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y /pkg/*.deb
            test -x /usr/bin/marlin
            if ldd /usr/bin/marlin | grep "not found"; then
              echo "::error::the .deb installs on a clean Ubuntu 22.04 but its dependencies do not cover it"
              exit 1
            fi
            echo "clean ubuntu:22.04: apt resolved every dependency and /usr/bin/marlin has all of its libraries"
          '
          echo "- Linux: the \`.deb\` resolves and installs on a bare ubuntu:22.04 with no build tooling" >> "$GITHUB_STEP_SUMMARY"

      # The reporting half begins here. None of the remaining steps gate, for
      # the reason given at the top of this job.
      #
      # Read these from the log or from the job summary, NOT from the step's
      # conclusion. `continue-on-error` does not merely stop a failed step
      # failing the job, it reports that step's `conclusion` as `success` in the
      # API and shows a tick in the UI; the real result is in `outcome`, which
      # is not in the jobs payload at all. Run 32601226543 had one of these
      # steps exit 1 and list as a success. Every probe below therefore writes
      # its own verdict into the step summary, where it cannot be laundered.
      #
      # The `if:` on each of these is the step-level version of the same rule
      # this job's own `if:` is about: do not let one artefact's problem delete
      # the other artefact's evidence. A step that fails normally skips every
      # step after it, so without this a broken Depends line in the .deb would
      # take the whole AppImage half of the report down with it, on the one run
      # where you most want to know whether the AppImage was fine. The condition
      # is "did we get far enough to have the file", nothing more.
      - name: Start the apt-installed binary, and see whether it stays up
        continue-on-error: true
        if: ${{ !cancelled() && env.MARLIN_DEB != '' }}
        run: |
          "$RUNNER_TEMP/stays-up.sh" "the .deb's /usr/bin/marlin" /usr/bin/marlin

      # The claim under test is on two public pages: that a stock Ubuntu user
      # running the AppImage plainly hits a libfuse.so.2 error. A FAIL here
      # whose output mentions libfuse is that claim being CORRECT, not the
      # AppImage being broken, which is why this cannot be allowed to gate.
      #
      # It passed on run 32601226543, on a runner whose linker cache had no
      # libfuse.so.2 in it. Read that carefully before quoting it: this runner
      # is a build machine, not a stock Ubuntu, and it can differ from one in
      # ways this step cannot see. The container step at the bottom of this job
      # is the controlled version of the same question, and the FUSE inventory
      # printed above is what tells the two apart.
      - name: Run the AppImage the way a stock Ubuntu user does
        continue-on-error: true
        if: ${{ !cancelled() && env.MARLIN_APPIMAGE != '' }}
        run: |
          "$RUNNER_TEMP/stays-up.sh" "the AppImage run plainly" "$MARLIN_APPIMAGE"

      # And the documented way out of it. This is the sentence the README and
      # the landing page both print, run verbatim.
      - name: Run the AppImage with the documented --appimage-extract-and-run fallback
        continue-on-error: true
        if: ${{ !cancelled() && env.MARLIN_APPIMAGE != '' }}
        run: |
          "$RUNNER_TEMP/stays-up.sh" "the AppImage with --appimage-extract-and-run" "$MARLIN_APPIMAGE" --appimage-extract-and-run

      # A stock Ubuntu, near enough, which is the environment the caveat on the
      # README and the landing page is a claim about, and which this runner is
      # not. Two things make it not: it has every -dev package the build needed,
      # and the first run of this job (32601226543) showed the AppImage mounting
      # and running on it with no libfuse2 present, which is the opposite of
      # what both pages say happens. One of those pages is wrong and this step
      # is how we find out which.
      #
      # What is reproduced in here, and each piece is deliberate:
      #
      #   fuse3, no libfuse2   exactly what Ubuntu >= 22.04 ships. fuse3 gives
      #                        you /usr/bin/fusermount3; the FUSE 2 helper
      #                        `fusermount` and libfuse.so.2 are both absent,
      #                        which is the whole substance of the caveat.
      #   --device /dev/fuse   a container has no FUSE device unless you hand it
      #                        one, and without it the AppImage fails for a
      #                        container reason rather than an Ubuntu one. The
      #                        first run failed exactly that way and it proved
      #                        nothing. A desktop has /dev/fuse.
      #   the X and font floor libfontconfig1 is here because the first run
      #                        died on it: the AppImage bundles the webview but
      #                        NOT fontconfig, so it needs the host to have it.
      #                        Every Linux desktop does. A bare container does
      #                        not, and that difference was reading as a broken
      #                        AppImage when it is a broken test environment.
      #
      # SYS_ADMIN and the apparmor opt-out are what let fusermount mount inside
      # a container at all. They are a property of running this in Docker, not
      # something a user needs, and nothing about Marlin changes because of them.
      #
      # Reporting only, and it stays that way: this is still a container, with no
      # GPU and no compositor, so a failure in here is evidence about how far the
      # AppImage gets rather than a verdict on somebody's Fedora.
      - name: Run the AppImage on a stock Ubuntu that has never seen a build
        continue-on-error: true
        if: ${{ !cancelled() && env.MARLIN_APPIMAGE != '' }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/marlin-img
          cp "$MARLIN_APPIMAGE" /tmp/marlin-img/marlin.AppImage

          # The container script lives in a FILE now, written by a quoted
          # heredoc and mounted in, rather than inline after `bash -c '...'`.
          # That is not a tidy-up, it is the fix for run 32603423745, where this
          # step ran for four seconds, printed nothing at all and reported
          # success.
          #
          # The cause was a comment. Two of them said "the host's job" and "the
          # AppImage's", and an apostrophe inside a single-quoted string closes
          # it. Everything from there on stopped being script and became
          # arguments, so the container ran `set -u`, `apt-get update -qq` and
          # a few comments, then exited 0 with nothing to say. Four seconds is
          # exactly how long `apt-get update -qq` takes.
          #
          # `bash -n` cannot catch this and did not: the mangled version is
          # perfectly legal shell, it just is not the shell anyone wrote. A
          # quoted heredoc has no such hole, because nothing inside `<<'STOCK'`
          # is interpreted by anybody until bash reads the file.
          cat > /tmp/marlin-img/stock-ubuntu.sh <<'STOCK'
          #!/usr/bin/env bash
          set -u
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq

          # fuse3 and no libfuse2, which is stock. Do not add libfuse2 here:
          # installing it is the very thing the caveat tells users to do, so a
          # container that has it cannot answer whether they need to.
          #
          # libgtk-3-0 rather than a list of individual libraries, and this is
          # the line that decides what the download page is allowed to claim.
          # The first two attempts guessed at the floor and were wrong twice,
          # dying on libfontconfig.so.1 and then on libfribidi.so.0, which is a
          # game of whack-a-mole with a public claim at the end of it. So draw
          # the boundary where the artefact draws it instead: the site says the
          # AppImage is 78MB "because it carries the webview with it". If that
          # is true then GTK belongs to the host and webkit belongs to the
          # AppImage, GTK is on every Linux desktop there is, and this container
          # is that split made explicit. libwebkit2gtk is deliberately NOT
          # installed: if the AppImage needs the host to have the webview, it
          # has no reason to be 78MB and the page needs rewriting.
          apt-get install -y xvfb dbus-x11 libgl1 libgtk-3-0 fonts-dejavu-core fuse3 > /dev/null
          cp /img/marlin.AppImage /tmp/m.AppImage
          chmod +x /tmp/m.AppImage

          echo "--- what this stock Ubuntu has for FUSE:"
          ldconfig -p | grep -i fuse | sed "s/^/      /" || echo "      no libfuse in the linker cache"
          command -v fusermount  || echo "      no fusermount (FUSE 2 helper), which is stock for >= 22.04"
          command -v fusermount3 || echo "      no fusermount3 (FUSE 3 helper)"
          ls -l /dev/fuse || echo "      no /dev/fuse"

          echo "--- plainly, which is what a stock Ubuntu user actually types:"
          timeout --kill-after=5 20 xvfb-run -a dbus-run-session -- /tmp/m.AppImage > /tmp/plain.log 2>&1
          plain=$?
          echo "    exit $plain  (124 means it was still running at 20s, which is the pass)"
          sed -n "1,20p" /tmp/plain.log | sed "s/^/      /"

          echo "--- with --appimage-extract-and-run, which is what we tell people to do:"
          timeout --kill-after=5 20 xvfb-run -a dbus-run-session -- /tmp/m.AppImage --appimage-extract-and-run > /tmp/fallback.log 2>&1
          fb=$?
          echo "    exit $fb  (124 means it was still running at 20s, which is the pass)"
          sed -n "1,20p" /tmp/fallback.log | sed "s/^/      /"

          # Self-diagnosing on the way down, because each round trip through CI
          # is twenty minutes and two rounds each surfaced exactly one missing
          # library. If it did not start, say what the payload wanted from the
          # host and could not find, all of it, at once.
          if [ $fb -ne 124 ]; then
            echo "--- what the AppImage payload wants from the host and cannot find:"
            ( cd /tmp && /tmp/m.AppImage --appimage-extract > /dev/null 2>&1 )
            LD_LIBRARY_PATH=/tmp/squashfs-root/usr/lib \
              ldd /tmp/squashfs-root/usr/bin/marlin 2>&1 | grep "not found" | sort -u | sed "s/^/      /" \
              || echo "      nothing missing, so it failed for some other reason"
          fi

          # This line is load-bearing beyond being readable: the step after this
          # one refuses to pass unless it appears, which is what stops this
          # probe ever silently not running again.
          echo "VERDICT plain=$plain fallback=$fb"
          STOCK

          docker run --rm \
            --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined \
            -v /tmp/marlin-img:/img:ro ubuntu:22.04 bash /img/stock-ubuntu.sh 2>&1 \
            | tee /tmp/stock-ubuntu.out
          rc=${PIPESTATUS[0]}

          # Written by hand rather than left to the step conclusion, because
          # `continue-on-error` makes a failed step report `success` in the API.
          # Anyone reading this job from the outside would be told it passed.
          verdict="$(grep '^VERDICT ' /tmp/stock-ubuntu.out || true)"
          if [ -n "$verdict" ]; then
            echo "- Linux: stock ubuntu:22.04, fuse3 and no libfuse2, GTK from the host: \`$verdict\` (124 is the pass)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Linux: the stock-Ubuntu probe produced no verdict, read the Linux smoke log" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      # Gating, and the one step in the reporting half that is. It asserts
      # nothing about the AppImage; it asserts that the question was asked.
      #
      # Run 32603423745 is why it exists. The probe above no-opped, said
      # nothing, and reported success, and a step that can silently not run is
      # worse than one that fails: a failure teaches you something and that
      # taught nothing while looking green. `continue-on-error` cannot express
      # "this half may fail but must execute", so the assertion moves out here
      # where a red X is a red job.
      #
      # Deliberately narrow. It does not care whether the AppImage worked, only
      # that the probe got far enough to say so, so a genuine 127 still passes
      # here and is still reported honestly above.
      - name: Check the stock Ubuntu probe actually ran
        if: ${{ !cancelled() && env.MARLIN_APPIMAGE != '' }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/stock-ubuntu.out ] || ! grep -q '^VERDICT ' /tmp/stock-ubuntu.out; then
            echo "::error::the stock-Ubuntu probe printed no VERDICT line, so it did not run to the end. Its output is the whole story:"
            sed -n '1,60p' /tmp/stock-ubuntu.out 2>/dev/null || echo "  it produced nothing at all"
            exit 1
          fi
          grep '^VERDICT ' /tmp/stock-ubuntu.out

  # Undraft only once every platform has attached something. A half-populated
  # release that is already public is the one state the update feed must never
  # be pointed at. No `always()` here, so this inherits "every leg of `bundle`
  # succeeded", and adding Linux to that matrix deliberately added Linux to this
  # gate: a release that says it ships Linux and does not is worse than a
  # release that waits.
  publish:
    name: Publish the release
    needs: bundle
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "### $TAG is live" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json assets --jq '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Now run \`scripts/publish.sh\` locally to point the update feed at it." >> "$GITHUB_STEP_SUMMARY"
