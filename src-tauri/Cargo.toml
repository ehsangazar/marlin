[package]
name = "marlin"
version = "0.1.0"
edition = "2021"
description = "A terminal built for running coding agents"
repository = "https://github.com/ehsangazar/marlin"
license = "MIT"

[lib]
name = "marlin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ignore = "0.4.33"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
