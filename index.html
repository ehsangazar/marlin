<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marlin</title>
  </head>
  <body>
    <div class="win">
      <div class="titlebar" data-tauri-drag-region>
        <span class="brand">Marlin</span>
        <span class="name" id="wintitle"></span>
        <span class="tools">
          <button class="tt" id="btn-new" title="New tab (⌘T)">+</button>
          <button class="tt" id="btn-bar" title="Cycle the tab bar (⌘⇧B)">⇋</button>
          <button class="tt" id="btn-tree" title="Show or hide the file tree (⌘B)">▤</button>
          <button class="tt" id="btn-settings" title="Settings (⌘,)">⚙</button>
        </span>
      </div>
      <div class="body h" id="winbody">
        <div class="tabbar" id="tabbar" role="tablist"></div>
        <div class="main">
          <aside class="tree" id="tree" aria-label="Explorer"></aside>
          <div class="treegrip" id="treegrip" role="separator" aria-orientation="vertical"
               aria-label="Resize the explorer"></div>
          <div class="panes" id="panes"></div>
        </div>
      </div>
      <div class="statusbar">
        <span>bar <b id="st-bar">horizontal</b></span>
        <span>tabs <b id="st-tabs">0</b></span>
        <span>panes <b id="st-panes">0</b></span>
        <span>shell <b id="st-shell">—</b></span>
        <span>theme <b id="st-theme">—</b></span>
        <button class="sterr" id="st-errors"></button>
        <span class="slinks">
          <button class="slink" id="lnk-bug" title="Something broken? Agents triage every issue">report a bug</button>
          <button class="slink" id="lnk-idea" title="Ask for a feature">request a feature</button>
          <button class="slink sponsor" id="lnk-sponsor" title="Marlin is free. Sponsorship is monthly and cancellable.">sponsor</button>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
